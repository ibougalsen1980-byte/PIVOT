# Sauvegarde hebdomadaire de la base Supabase de PIVOT (ajoutée le 14/11/2026).
# L'offre gratuite de Supabase n'inclut aucune sauvegarde. Ce workflow exporte la base chaque lundi
# et la range, chiffrée, dans les artefacts GitHub (conservés 90 jours).
#
# Le dépôt est public : la sauvegarde est donc chiffrée avec une phrase secrète avant d'être déposée.
# Sans la phrase, le fichier est illisible. Deux secrets à créer dans GitHub
# (Settings > Secrets and variables > Actions) :
#   SUPABASE_DB_URL     chaîne de connexion « Session pooler » de Supabase (Connect > Session pooler),
#                       mot de passe de la base inclus.
#   BACKUP_PASSPHRASE   phrase secrète longue, à garder hors de GitHub (gestionnaire de mots de passe).
#
# Restaurer :  gpg --decrypt pivot-AAAA-MM-JJ.sql.gz.gpg | gunzip > pivot.sql   puis   psql "<url>" -f pivot.sql
name: Sauvegarde base Supabase

on:
  schedule:
    - cron: '17 3 * * 1'   # chaque lundi vers 4 h 17, heure de Paris en hiver
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Vérifier les secrets
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then
            echo "::error::Secrets SUPABASE_DB_URL et BACKUP_PASSPHRASE manquants (voir l'en-tête du fichier)."
            exit 1
          fi

      - name: Installer pg_dump 17 (même version que la base)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Exporter et chiffrer
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -o pipefail
          F="pivot-$(date -u +%F).sql.gz.gpg"
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --schema=public --schema=auth --no-owner --no-privileges \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASS" -o "$F"
          ls -l "$F"
          test "$(stat -c %s "$F")" -gt 1000
          echo "FICHIER=$F" >> "$GITHUB_ENV"

      - name: Déposer la sauvegarde chiffrée
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FICHIER }}
          path: ${{ env.FICHIER }}
          retention-days: 90
          if-no-files-found: error
