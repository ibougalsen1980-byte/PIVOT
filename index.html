<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PIVOT, Prototype coach de basket</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#f4f1ea; --panel:#ffffff; --panel2:#f6f2ea; --line:#e6e0d4;
    --txt:#181c22; --muted:#6a7178; --accent:#e8631f; --accent2:#ff8a4c;
    --ok:#1a9e6a; --warn:#c98a12; --bad:#d64545; --blue:#2f6bd6;
    --off:#e8631f; --def:#2f6bd6; --ball:#e6a700;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#e7e1d4;color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);
    display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px rgba(0,0,0,.6)}
  header.top{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.5px}
  .brand .dot{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-size:15px;color:#101317;font-weight:900}
  .brand small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .teampill{font-size:11px;color:var(--muted);background:var(--panel2);padding:5px 9px;border-radius:20px;border:1px solid var(--line)}
  main{flex:1;overflow-y:auto;padding:14px 14px 90px}
  nav.tabs{position:sticky;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
  nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font-size:10.5px;font-weight:600;
    padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  nav.tabs button .ic{font-size:19px;line-height:1}
  nav.tabs button.active{color:var(--accent)}
  h2.view-title{font-size:20px;margin:2px 0 12px;font-weight:800}
  .sub{color:var(--muted);font-size:12.5px;margin:-8px 0 14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .muted{color:var(--muted)}
  .tag{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .btn{background:var(--accent);color:#101317;border:0;border-radius:11px;padding:11px 14px;font-weight:800;
    font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
  .btn:active{transform:translateY(1px)}
  .btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--txt)}
  .btn.sm{padding:7px 10px;font-size:12px;border-radius:9px}
  .btn.block{width:100%}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi .n{font-size:22px;font-weight:800}
  .kpi .l{font-size:11px;color:var(--muted);margin-top:2px}
  .listitem{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
  .listitem:last-child{border-bottom:0}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
    display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto}
  .num{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#101317;display:grid;place-items:center;font-weight:800;font-size:12px}
  .pos{font-size:10px;color:var(--muted)}
  .reco{border-left:3px solid var(--accent);background:linear-gradient(90deg,rgba(245,106,38,.10),transparent);
    padding:10px 12px;border-radius:8px;margin-bottom:8px;font-size:12.5px}
  .reco b{color:var(--accent2)}
  .alert{display:flex;gap:9px;align-items:center;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line)}
  .alert:last-child{border-bottom:0}
  .badge{font-size:9px;padding:2px 6px;border-radius:6px;font-weight:700}
  .badge.warn{background:rgba(245,197,66,.15);color:var(--warn)}
  .badge.bad{background:rgba(239,85,85,.15);color:var(--bad)}
  .badge.ok{background:rgba(55,201,138,.15);color:var(--ok)}
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:10px;font-size:14px;width:100%;font-family:inherit}
  label.fld{display:block;font-size:11px;color:var(--muted);margin:0 0 5px 2px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal-bg.on{display:flex}
  .modal{background:var(--panel);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);max-height:88vh;overflow-y:auto}
  .modal h3{margin:0 0 12px;font-size:17px}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;background:none;border:0;color:var(--muted);padding:8px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer}
  .seg button.active{background:var(--accent);color:#101317}
  /* stat entry */
  .court-players{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
  .pchip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;font-size:11px}
  .pchip.sel{background:var(--accent);color:#101317;border-color:var(--accent);font-weight:800}
  .pchip .pn{font-weight:800;font-size:15px;display:block}
  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
  .abtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px 4px;
    font-weight:700;font-size:12.5px;cursor:pointer;text-align:center}
  .abtn:active{background:var(--accent);color:#101317}
  .abtn.wide{grid-column:span 3}
  .scorebar{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border:1px solid var(--line);
    border-radius:12px;padding:10px 14px;margin-bottom:10px}
  .scorebar .s{font-size:26px;font-weight:800}
  table.box{width:100%;border-collapse:collapse;font-size:11px}
  table.box th,table.box td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}
  table.box th{color:var(--muted);font-weight:600;font-size:10px}
  table.box td.name{text-align:left;font-weight:700}
  .toolbar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .tool{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 9px;font-size:11px;cursor:pointer;font-weight:600}
  .tool.active{background:var(--accent);color:#101317;border-color:var(--accent)}
  .frames{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
  .frame-thumb{flex:0 0 auto;width:52px;height:48px;border-radius:8px;border:2px solid var(--line);background:#0c2b17;
    display:grid;place-items:center;font-size:11px;color:var(--muted);cursor:pointer;position:relative}
  .frame-thumb.active{border-color:var(--accent);color:var(--txt)}
  .frame-thumb small{position:absolute;top:2px;left:5px;font-size:9px}
  svg.court{width:100%;display:block;background:#14572b;border-radius:12px;border:1px solid #0c3d1e;touch-action:none}
  .hint{font-size:11px;color:var(--muted);margin:6px 2px}
  .block-item{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px}
  .block-item .bt{flex:1}
  .block-item .bt b{font-size:13px}
  .block-item .bt small{color:var(--muted);font-size:11px}
  .iconbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px}
  .timerbig{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
  .flash{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--panel);border:1px solid var(--line);
    color:var(--txt);padding:9px 16px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
  .flash.on{opacity:1}
  .pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  a.reset{color:var(--muted);font-size:11px;text-decoration:underline;cursor:pointer}
  #aiFab{position:absolute;right:14px;bottom:80px;width:52px;height:52px;border-radius:50%;border:0;z-index:30;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#101317;font-size:22px;font-weight:800;
    box-shadow:0 6px 18px rgba(245,106,38,.45);cursor:pointer}
  #aiFab:active{transform:translateY(1px)}
  .chat{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:4px 0 8px}
  .msg{padding:9px 12px;border-radius:14px;font-size:13px;max-width:85%;line-height:1.35}
  .msg.ai{background:var(--panel2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
  .msg.me{background:var(--accent);color:#101317;align-self:flex-end;border-bottom-right-radius:4px;font-weight:600}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:16px;padding:6px 10px;font-size:11px;cursor:pointer}
  .prog{height:7px;border-radius:5px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}

  /* ===================== PREMIUM SKIN (univers basket) ===================== */
  body{background:#e7e1d4;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  #app{
    background:
      radial-gradient(1100px 340px at 50% -160px, rgba(232,99,31,.10), transparent 62%),
      linear-gradient(180deg,#faf7f1 0%, #f4f1ea 100%);
  }
  #app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background-image:repeating-linear-gradient(90deg, rgba(120,90,60,.05) 0 1px, transparent 1px 46px);}
  header.top, main, nav.tabs{position:relative;z-index:1}

  header.top{
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);
    border-bottom:2px solid transparent;
    border-image:linear-gradient(90deg,var(--accent),var(--accent2),transparent) 1;
    padding:16px 16px 12px;
  }
  .brand{font-family:'Oswald',sans-serif;font-size:22px;letter-spacing:2px;text-transform:uppercase;color:var(--txt)}
  .brand .dot{width:30px;height:30px;border-radius:9px;font-family:'Oswald',sans-serif;font-size:18px;color:#fff;
    box-shadow:0 4px 12px rgba(232,99,31,.4), inset 0 0 0 1px rgba(255,255,255,.25);position:relative;overflow:hidden}
  .brand .dot::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent 48%, rgba(0,0,0,.22) 49% 51%, transparent 52%);}
  .brand small{font-family:'Inter',sans-serif;letter-spacing:.3px;text-transform:none;font-size:10px;margin-top:1px;color:var(--muted)}
  .teampill{background:#fff;border:1px solid var(--line);color:var(--txt);font-weight:700;letter-spacing:.3px;
    font-size:11px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}

  h2.view-title{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    font-size:26px;color:var(--txt);-webkit-text-fill-color:initial}
  .card h3{font-family:'Oswald',sans-serif;letter-spacing:.6px;text-transform:uppercase;font-size:13px;color:var(--txt)}

  .card{background:#ffffff;border:1px solid var(--line);border-radius:16px;
    box-shadow:0 4px 16px rgba(60,50,40,.06)}

  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:14px}
  .kpi .n{font-family:'Oswald',sans-serif;font-weight:700;font-size:26px;color:var(--accent);-webkit-text-fill-color:initial}
  .kpi .l{text-transform:uppercase;letter-spacing:.5px;font-size:10px}

  .btn{background:var(--accent);color:#fff;
    box-shadow:0 4px 12px rgba(232,99,31,.28);letter-spacing:.3px}
  .btn.sec{background:#fff;color:var(--txt);border:1px solid var(--line);box-shadow:none}
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
  .num{font-family:'Oswald',sans-serif;border-radius:8px;color:#fff;
    box-shadow:0 2px 6px rgba(232,99,31,.35)}

  nav.tabs{background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
  nav.tabs button{color:var(--muted)}
  nav.tabs button.active{color:var(--accent)}

  .avatar{background:var(--panel2);border:1px solid var(--line);font-family:'Oswald',sans-serif;color:var(--txt)}
  .pchip{color:var(--txt)}
  .pchip.sel{color:#fff;box-shadow:0 4px 12px rgba(232,99,31,.35)}
  .pchip .pn{font-family:'Oswald',sans-serif}
  .scorebar{background:var(--panel2);border:1px solid var(--line)}
  .scorebar .s{font-family:'Oswald',sans-serif;font-size:30px;color:var(--txt)}
  .timerbig{font-family:'Oswald',sans-serif;color:var(--txt)}
  table.box td.name{font-weight:600}
  .reco b{color:var(--accent)}
  .hint{color:var(--muted)}

  #aiFab{color:#fff;box-shadow:0 6px 18px rgba(232,99,31,.45);animation:fabpulse 2.6s ease-in-out infinite}
  @keyframes fabpulse{0%,100%{box-shadow:0 6px 18px rgba(232,99,31,.35)}50%{box-shadow:0 6px 26px rgba(232,99,31,.6)}}

  .tag{text-transform:uppercase;letter-spacing:.4px;font-weight:600;background:var(--panel2);color:var(--muted)}
  .modal{background:#ffffff;border-top:3px solid var(--accent)}
  .modal h3{font-family:'Oswald',sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--txt)}
  .sysrow{display:flex;align-items:center;gap:11px;background:var(--panel2);
    border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
  .sysrow .badgepos{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.5px;color:var(--accent);
    text-transform:uppercase}
  .levelchip{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
  .levelchip.pro{background:rgba(47,107,214,.14);color:#1f4f9e}
  .levelchip.form{background:rgba(26,158,106,.16);color:#12704a}

  /* ===================== SENIOR UI/UX PASS ===================== */
  /* Transitions maîtrisées, seulement sur l'interactif, jamais sur le SVG */
  .btn,.abtn,.tool,.chip,.pchip,.iconbtn,.pcolor,.teampill,.sysrow,.listitem,.block-item,.kpi,.card,nav.tabs button,.frame-thumb,.seg button{
    transition:background-color .15s ease,border-color .15s ease,box-shadow .18s ease,transform .12s ease,color .15s ease}
  /* Retour tactile, effet d'enfoncement */
  .btn:active,.abtn:active,.tool:active,.chip:active,.iconbtn:active,.sysrow:active,.pchip:active,.block-item:active,.pcolor:active,.teampill:active{transform:scale(.97)}
  .card:active{transform:scale(.994)}
  /* Accessibilité, anneau de focus visible */
  button:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible,.sysrow:focus-visible{
    outline:none;box-shadow:0 0 0 3px rgba(232,99,31,.35)}
  /* Échelle d'élévation cohérente */
  .card{box-shadow:0 1px 2px rgba(40,33,26,.05),0 6px 18px rgba(40,33,26,.06)}
  .kpi{box-shadow:0 1px 2px rgba(40,33,26,.04)}
  .modal{box-shadow:0 -10px 44px rgba(0,0,0,.28)}
  #aiFab{will-change:transform}
  #aiFab:active{transform:scale(.92)}
  /* Cibles tactiles confortables */
  .btn.sm{min-height:36px} .iconbtn{min-width:34px;min-height:34px} nav.tabs button{min-height:54px}
  input,select{min-height:44px}
  /* Survol sur écran large */
  @media (hover:hover){
    .btn:hover{filter:brightness(1.04)}
    .btn.sec:hover,.btn.ghost:hover{background:var(--panel2)}
    .sysrow:hover,.listitem:hover{background:#fbf8f2}
    .card:hover{box-shadow:0 2px 4px rgba(40,33,26,.06),0 10px 26px rgba(40,33,26,.09)}
    .chip:hover{border-color:var(--accent)}
  }
  /* Mouvement d'entrée d'écran, discret et directionnel */
  @keyframes vfade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  main.enter{}
  /* Feuille modale qui monte de sa source */
  @keyframes sheetup{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
  .modal-bg.on .modal{animation:sheetup .24s cubic-bezier(.2,.8,.2,1)}
  .modal-bg{transition:opacity .2s ease}
  /* Titres et respiration */
  h2.view-title{margin:4px 0 10px}
  .sub{line-height:1.5}
  .card{padding:15px 15px}
  /* ===================== MOTION DESIGN ===================== */
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;
    background:radial-gradient(600px 300px at 50% 30%,rgba(232,99,31,.10),transparent),linear-gradient(180deg,#faf7f1,#efe9de)}
  #splash.gone{opacity:0;transition:opacity .45s ease;pointer-events:none}
  #splash .sp-logo{width:78px;height:78px;border-radius:21px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;display:grid;place-items:center;font-family:'Oswald',sans-serif;font-size:44px;
    box-shadow:0 14px 34px rgba(232,99,31,.45);animation:splashpop .6s cubic-bezier(.2,.9,.2,1.2) both}
  #splash .sp-ball{width:15px;height:15px;border-radius:50%;background:var(--ball);margin-top:16px;
    box-shadow:0 3px 6px rgba(0,0,0,.2);animation:dribble 1.05s ease-in-out .25s both}
  #splash .sp-word{position:absolute;bottom:36%;font-family:'Oswald',sans-serif;letter-spacing:7px;font-size:20px;color:var(--txt);opacity:0;animation:wordin .5s ease .5s both}
  @keyframes splashpop{0%{transform:scale(.4) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
  @keyframes wordin{from{opacity:0;transform:translateY(8px)}to{opacity:.9;transform:none}}
  @keyframes dribble{0%{transform:translateY(-34px);opacity:0}30%{opacity:1}55%{transform:translateY(7px)}75%{transform:translateY(-12px)}100%{transform:translateY(0)}}
  main.enter > *{opacity:0;animation:vfade .4s cubic-bezier(.2,.8,.2,1) forwards}
  main.enter > *:nth-child(1){animation-delay:.02s}
  main.enter > *:nth-child(2){animation-delay:.06s}
  main.enter > *:nth-child(3){animation-delay:.10s}
  main.enter > *:nth-child(4){animation-delay:.14s}
  main.enter > *:nth-child(5){animation-delay:.18s}
  main.enter > *:nth-child(6){animation-delay:.22s}
  main.enter > *:nth-child(7){animation-delay:.26s}
  main.enter > *:nth-child(n+8){animation-delay:.30s}
  nav.tabs button{position:relative}
  nav.tabs button.active::after{content:"";position:absolute;top:2px;left:50%;width:20px;height:3px;border-radius:3px;
    background:var(--accent);transform:translateX(-50%) scaleX(0);animation:tabbar .28s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes tabbar{to{transform:translateX(-50%) scaleX(1)}}
  .kpi .n,.scorebar .s{font-variant-numeric:tabular-nums}

  /* ===================== GLASSMORPHISM / NEUMORPHISM / 3D ===================== */
  /* Glass sur le chrome, matière dominante */
  header.top{background:rgba(255,255,255,.60);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5)}
  nav.tabs{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5)}
  .modal{background:rgba(255,255,255,.80);-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);border-top:3px solid var(--accent)}
  .modal-bg{background:rgba(22,16,10,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  #aiFab{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .teampill{background:rgba(255,255,255,.68);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .card.glass{background:rgba(255,255,255,.52);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border:1px solid rgba(255,255,255,.75)}
  /* Neumorphism, accents tactiles seulement */
  .seg{background:#efe9de;border:0;box-shadow:inset 3px 3px 7px rgba(176,158,130,.5),inset -3px -3px 7px rgba(255,255,255,.9)}
  .seg button.active{box-shadow:2px 2px 6px rgba(176,158,130,.55),-2px -2px 6px rgba(255,255,255,.95)}
  #pencolors .pcolor{box-shadow:2px 2px 5px rgba(176,158,130,.55),-2px -2px 5px rgba(255,255,255,.9) !important}
  .kpi{border:0;box-shadow:4px 4px 10px rgba(176,158,130,.32),-4px -4px 10px rgba(255,255,255,.85)}
  /* 3D léger et maîtrisé */
  .brand .dot{transition:transform .35s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
  .kpi{transform-style:preserve-3d}
  .kpi:active{transform:perspective(500px) rotateX(7deg) scale(.98)}
  @media (hover:hover){ .brand:hover .dot{transform:perspective(320px) rotateY(20deg) rotateX(7deg)} }
  #spLottie{width:104px;height:104px;margin-top:8px}
  #splash .sp-ball{background:radial-gradient(circle at 34% 30%,#ffd98a,var(--ball) 52%,#a97900);box-shadow:0 4px 8px rgba(0,0,0,.22),inset -3px -3px 6px rgba(0,0,0,.18),inset 2px 2px 5px rgba(255,255,255,.5)}

  /* ===================== IMMERSIF ===================== */
  /* Parquet de basket légèrement texturé */
  #app{background:
    radial-gradient(1100px 340px at 50% -160px, rgba(232,99,31,.09), transparent 62%),
    linear-gradient(180deg,#f6ecda 0%, #efe4cf 100%) !important}
  #app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.55;
    background-image:
      repeating-linear-gradient(90deg, rgba(120,85,50,.11) 0 1px, transparent 1px 148px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.40) 0 1px, rgba(120,85,50,.07) 1px 2px, transparent 2px 30px);
    background-position:0 0, 74px 0}
  /* Cartes qui se soulèvent */
  @media (hover:hover){
    .card:hover{transform:translateY(-3px);box-shadow:0 4px 8px rgba(40,33,26,.08),0 18px 36px rgba(40,33,26,.13)}
  }
  .card:active{transform:translateY(-1px) scale(.997)}
  /* Barres de stats qui poussent à l'apparition */
  .prog i{transform-origin:left;animation:growx .6s cubic-bezier(.2,.8,.2,1) both}
  @keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  /* Tracés tactiques qui se dessinent */
  @keyframes pdraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .court path.pdraw{stroke-dasharray:1;animation:pdraw .55s cubic-bezier(.4,.6,.3,1) forwards}
  /* Timeline du calendrier */
  .tl{position:relative;padding-left:26px}
  .tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
  .tl .ev{position:relative;margin-bottom:12px;opacity:0;animation:tlin .4s cubic-bezier(.2,.8,.2,1) forwards}
  .tl .ev::before{content:"";position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(232,99,31,.18)}
  .tl .ev.game::before{background:var(--blue);box-shadow:0 0 0 3px rgba(47,107,214,.18)}
  .tl .ev:nth-child(1){animation-delay:.05s}.tl .ev:nth-child(2){animation-delay:.13s}.tl .ev:nth-child(3){animation-delay:.21s}
  .tl .ev:nth-child(4){animation-delay:.29s}.tl .ev:nth-child(5){animation-delay:.37s}.tl .ev:nth-child(6){animation-delay:.45s}
  @keyframes tlin{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}

  /* ===================== PREMIUM WOW ===================== */
  #main{perspective:1100px}
  /* Transition de page en 3D, plus vivante */
  @keyframes cardin{from{opacity:0;transform:perspective(900px) translateY(26px) rotateX(9deg) scale(.97)}to{opacity:1;transform:none}}
  main.enter > *{animation-name:cardin !important;animation-duration:.5s !important;animation-timing-function:cubic-bezier(.2,.85,.25,1) !important}
  /* Inclinaison 3D des cartes sous le pointeur */
  .card{will-change:transform}
  .card.tilted{transition:transform .07s linear, box-shadow .2s ease;box-shadow:0 20px 44px rgba(40,33,26,.20)}
  /* Reflet qui balaie les boutons primaires */
  .btn:not(.sec):not(.ghost){position:relative;overflow:hidden}
  .btn:not(.sec):not(.ghost)::after{content:"";position:absolute;top:0;left:-130%;width:55%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);pointer-events:none}
  @media (hover:hover){ .btn:not(.sec):not(.ghost):hover::after{left:150%;transition:left .65s ease} }
  /* Bannière d'accueil premium */
  .hero{position:relative;overflow:hidden;border-radius:20px;padding:22px 18px;color:#fff;margin:2px 0 14px;
    background:linear-gradient(135deg,#ef6c2f 0%,#ff9a58 42%,#c0431a 100%);
    box-shadow:0 16px 38px rgba(232,99,31,.38);transform-style:preserve-3d}
  .hero::before{content:"";position:absolute;inset:0;opacity:.18;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 1px,transparent 1px 46px)}
  .hero .sheen{position:absolute;inset:0;background:linear-gradient(100deg,transparent 32%,rgba(255,255,255,.35) 50%,transparent 68%);
    transform:translateX(-120%);animation:sheen 3.6s ease-in-out infinite}
  @keyframes sheen{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
  .hero .eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.9;position:relative;z-index:1}
  .hero .big{font-family:'Oswald',sans-serif;font-size:32px;line-height:1.02;text-transform:uppercase;letter-spacing:1px;margin-top:3px;position:relative;z-index:1;text-shadow:0 2px 10px rgba(0,0,0,.15)}
  .hero .small{font-size:12.5px;opacity:.92;margin-top:7px;position:relative;z-index:1}
  /* Icône d'onglet actif qui rebondit */
  nav.tabs button.active .ic{animation:navpop .34s cubic-bezier(.2,.8,.2,1.5)}
  @keyframes navpop{0%{transform:scale(.75)}60%{transform:scale(1.28)}100%{transform:scale(1)}}

  /* ===================== DESIGN SYSTEM v2 (icônes + tab bar) ===================== */
  .mi{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;
    text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block}
  .teampill.mi{font-size:20px;padding:0;color:var(--txt);display:grid;place-items:center;width:38px;height:34px}
  #aiFab .mi{font-size:27px}
  main{padding:16px 16px 100px}
  /* Barre d'onglets flottante, façon Linear et Strava */
  nav.tabs{margin:0 12px calc(12px + env(safe-area-inset-bottom));border-radius:26px;padding:7px 6px;border:1px solid rgba(255,255,255,.65);
    box-shadow:0 14px 34px rgba(40,33,26,.20);background:rgba(255,255,255,.70);
    -webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6)}
  nav.tabs button{border-radius:18px;min-height:50px;gap:4px;transition:background-color .22s ease,color .22s ease}
  nav.tabs button .ic.mi{font-size:24px;font-variation-settings:'FILL' 0,'wght' 500}
  nav.tabs button.active{background:rgba(232,99,31,.13);color:var(--accent)}
  nav.tabs button.active .ic.mi{font-variation-settings:'FILL' 1,'wght' 600}
  nav.tabs button.active::after{display:none}
  nav.tabs button .lbl{font-size:10px;font-weight:600;letter-spacing:.2px}

  /* ===================== PANNEAU D'AFFICHAGE ===================== */
  .scoreboard{position:relative;overflow:hidden;background:linear-gradient(180deg,#161b21,#0b0e12);
    border:1px solid #262e38;border-radius:16px;padding:14px 16px;margin-bottom:12px;
    box-shadow:inset 0 0 22px rgba(0,0,0,.55),0 8px 22px rgba(0,0,0,.18)}
  .scoreboard::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
  .sb-row{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .sb-date{font-family:'Oswald',sans-serif;letter-spacing:2px;text-transform:uppercase;font-size:12px;color:#ff8a4c}
  .sb-time{font-family:'Oswald',sans-serif;font-weight:700;font-size:32px;letter-spacing:3px;color:#ffd23f;
    text-shadow:0 0 12px rgba(255,210,63,.55);font-variant-numeric:tabular-nums}
  .sb-quote{position:relative;z-index:1;margin-top:11px;padding-top:11px;border-top:1px dashed rgba(255,255,255,.13);
    color:#e9edf1;font-size:13px;line-height:1.5;font-style:italic}
  .sb-quote .lbl2{display:block;font-style:normal;text-transform:uppercase;letter-spacing:1.5px;font-size:9px;color:#ff8a4c;margin-bottom:4px}
  /* Pied de page */
  .footer{margin-top:14px;text-align:center}
  .foot-links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
  .foot-links a{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);
    padding:7px 12px;border-radius:20px;cursor:pointer}
  @media (hover:hover){ .foot-links a:hover{border-color:var(--accent);color:var(--accent)} }
  .foot-copy{font-size:11px;color:var(--muted);opacity:.85}
  .faq-q{font-weight:700;font-size:13.5px;margin-bottom:3px}
  .faq-a{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:12px}

  /* ===================== ABONNEMENT & PREMIERS PAS ===================== */
  .pp{position:relative;overflow:hidden;background:linear-gradient(135deg,#161b22,#0c0f14);color:#fff;
    border:1px solid #262e38;border-radius:16px;padding:16px;margin-bottom:12px}
  .pp::after{content:"";position:absolute;top:-40%;right:-10%;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,rgba(232,99,31,.35),transparent 70%)}
  .pp .ppt{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:17px;letter-spacing:.6px;position:relative;z-index:1}
  .offer{background:linear-gradient(135deg,#ef6c2f,#ff9a58);color:#fff;border-radius:14px;padding:12px 14px;text-align:center;margin-bottom:12px;font-weight:700;box-shadow:0 8px 20px rgba(232,99,31,.3)}
  .plan{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;background:var(--panel)}
  .plan.reco{border:2px solid var(--accent);box-shadow:0 12px 28px rgba(232,99,31,.18)}
  .plan .pname{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;font-size:16px}
  .plan .price{font-family:'Oswald',sans-serif;font-size:28px;margin:4px 0;color:var(--txt)}
  .plan .price small{font-size:12px;color:var(--muted);font-weight:400}
  .plan ul{margin:8px 0 0;padding-left:18px;font-size:12.5px;line-height:1.65}
  .plan .tagreco{display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:20px;margin-bottom:6px}
  .steps .st{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .steps .st:last-child{border-bottom:0}
  .steps .st .ck{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;border:2px solid var(--line);color:var(--muted);font-size:18px}
  .steps .st.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
  .steps .st .lbl3{flex:1;font-size:13px;font-weight:600}
  .steps .st.done .lbl3{color:var(--muted);text-decoration:line-through;font-weight:400}

  /* Respecte la préférence de mouvement réduit */
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition-duration:.001s !important}
    main.enter > *{opacity:1 !important}
    .tl .ev{opacity:1 !important}
    .hero .sheen{display:none !important}
    #splash{display:none !important}
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="dot">P</div>
      <div>PIVOT<small id="teamName">Coach</small></div>
    </div>
    <div class="row" style="gap:6px">
      <button class="teampill mi" id="muteBtn" onclick="toggleMute()" title="Sons">volume_up</button>
      <button class="teampill mi" onclick="openLangPicker()" title="Langue">language</button>
      <button class="teampill" id="datePill" onclick="openTeamSwitcher()">Équipe ▾</button>
    </div>
  </header>
  <main id="main"></main>
  <button id="aiFab" onclick="aiChat()" title="Assistant IA"><span class="mi">auto_awesome</span></button>
  <nav class="tabs" id="tabs">
    <button data-v="home" class="active"><span class="ic mi">home</span><span class="lbl">Accueil</span></button>
    <button data-v="roster"><span class="ic mi">groups</span><span class="lbl">Effectif</span></button>
    <button data-v="session"><span class="ic mi">assignment</span><span class="lbl">Séance</span></button>
    <button data-v="match"><span class="ic mi">sports_basketball</span><span class="lbl">Match</span></button>
    <button data-v="tactics"><span class="ic mi">draw</span><span class="lbl">Tactique</span></button>
  </nav>
</div>

<div id="splash"><div class="sp-logo">P</div><div class="sp-ball" id="spBall"></div><div id="spLottie"></div><div class="sp-word">PIVOT</div></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="flash" id="flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script>
"use strict";
/* ============ ÉTAT / DONNÉES ============ */
const LS_KEY = "pivot_proto_v2";
const POSITIONS = ["Meneur","Arrière","Ailier","Ailier fort","Pivot"];
function uid(){return Math.random().toString(36).slice(2,9)}

function demoPlayers(){return [
    {id:uid(),first:"Amadou",last:"Ba",num:4,pos:"Meneur",present:true},
    {id:uid(),first:"Youssou",last:"Ndiaye",num:5,pos:"Arrière",present:true},
    {id:uid(),first:"Ibrahim",last:"Fall",num:6,pos:"Ailier",present:true},
    {id:uid(),first:"Cheikh",last:"Diop",num:7,pos:"Ailier fort",present:true},
    {id:uid(),first:"Moussa",last:"Sarr",num:8,pos:"Pivot",present:true},
    {id:uid(),first:"Lamine",last:"Sow",num:9,pos:"Arrière",present:true},
    {id:uid(),first:"Pape",last:"Gueye",num:10,pos:"Ailier",present:false},
    {id:uid(),first:"Ousmane",last:"Kane",num:11,pos:"Pivot",present:true},
    {id:uid(),first:"Modou",last:"Sy",num:12,pos:"Meneur",present:true},
    {id:uid(),first:"Babacar",last:"Faye",num:13,pos:"Ailier fort",present:false},
  ];}
function newTeam(name,category,level,players){return {
    id:uid(), name:name, category:category||"Seniors", level:level||"Départemental", season:"2026-2027",
    players:players||[], session:{title:"Nouvelle séance", blocks:[]},
    match:{opponent:"Adversaire", live:false, events:[], onCourt:[]}
  };}
const SEED = {
  profile:{done:false, name:"", years:"", diplomas:[], level:"", category:""},
  drills:[
    {id:uid(),title:"Mise en train + appuis",cat:"Échauffement",dur:10,intensity:"Faible"},
    {id:uid(),title:"Ball handling 2 ballons",cat:"Maniement",dur:12,intensity:"Moyenne"},
    {id:uid(),title:"Tir en sortie de dribble",cat:"Tir",dur:15,intensity:"Moyenne"},
    {id:uid(),title:"3 contre 2 transition",cat:"Jeu collectif",dur:15,intensity:"Forte"},
    {id:uid(),title:"Pick and roll aile",cat:"Jeu collectif",dur:12,intensity:"Moyenne"},
    {id:uid(),title:"Défense sur homme + aide",cat:"Défense",dur:12,intensity:"Forte"},
    {id:uid(),title:"Lancers francs sous fatigue",cat:"Tir",dur:8,intensity:"Faible"},
    {id:uid(),title:"5 contre 5 dirigé",cat:"Situation match",dur:16,intensity:"Forte"},
  ],
  plays:[], continuity:{}, consentShare:{},
  teams:[ (function(){const t=newTeam("U15 Garçons","U15","Départemental",demoPlayers());t.match.opponent="AS Dakar";return t;})() ],
  activeTeam:null
};

let DB = load();
migrateDB();
function T(){
  if(DB.teams && DB.teams.length){ return DB.teams.find(t=>t.id===DB.activeTeam) || DB.teams[0]; }
  return {players:[],session:{title:"",blocks:[]},match:{opponent:"",events:[]},name:"",season:"",category:"",level:""};
}
function migrateDB(){
  if(!DB.teams || !DB.teams.length){ DB.teams = JSON.parse(JSON.stringify(SEED.teams)); }
  if(!DB.profile) DB.profile={done:false,name:"",years:"",diplomas:[],level:"",category:""};
  if(!DB.continuity) DB.continuity={};
  if(!DB.consentShare) DB.consentShare={};
  if(!DB.drills) DB.drills=JSON.parse(JSON.stringify(SEED.drills));
  if(!DB.plays) DB.plays=[];
  if(!DB.activeTeam) DB.activeTeam=DB.teams[0].id;
  const p0=T().players[0];
  if(p0 && Object.keys(DB.continuity).length===0){
    DB.continuity[p0.id]=[
      {date:"02/07",focus:"Tir extérieur",note:"50 tirs, 31 réussis (62%)"},
      {date:"05/07",focus:"Maniement",note:"20 min ball handling, main faible"}
    ];
    DB.consentShare[p0.id]=true;
  }
  save();
}
function load(){
  try{const s=localStorage.getItem(LS_KEY); if(s) return JSON.parse(s);}catch(e){}
  return JSON.parse(JSON.stringify(SEED));
}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(DB))}catch(e){}}
function resetAll(){ if(confirm("Réinitialiser toutes les données de démonstration ?")){DB=JSON.parse(JSON.stringify(SEED)); DB.activeTeam=DB.teams[0].id; save(); render();} }
function switchTeam(id){ DB.activeTeam=id; save(); closeModal(); render(); }
function openTeamSwitcher(){
  openModal(`
    <h3>Mes équipes</h3>
    <div class="sub">Change d'équipe ou ajoute-en une</div>
    ${DB.teams.map(t=>`<div class="sysrow" onclick="switchTeam('${t.id}')" style="cursor:pointer">
      <div style="flex:1"><div style="font-weight:700;font-size:14px">${t.name}</div><div class="badgepos">${t.category} · ${t.level}</div></div>
      ${t.id===DB.activeTeam?'<span class="levelchip pro">Active</span>':'<span class="btn sm sec">Ouvrir</span>'}
    </div>`).join("")}
    <button class="btn block" style="margin-top:8px" onclick="addTeamModal()">＋ Ajouter une équipe</button>
    <button class="btn sec block" style="margin-top:8px" onclick="closeModal()">Fermer</button>
  `);
}
const CATS=["U7","U9","U11","U13","U15","U18","Seniors"];
const LEVELS=["École de basket","Départemental","Régional","National","Centre de formation","Professionnel"];
function addTeamModal(){
  openModal(`
    <h3>Nouvelle équipe</h3>
    <label class="fld">Nom de l'équipe</label><input id="nt_name" placeholder="Ex : U13 Filles">
    <div class="grid2" style="margin-top:8px">
      <div><label class="fld">Catégorie</label><select id="nt_cat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></div>
      <div><label class="fld">Niveau</label><select id="nt_lvl">${LEVELS.map(l=>`<option>${l}</option>`).join("")}</select></div>
    </div>
    <div style="height:14px"></div>
    <button class="btn block" onclick="createTeam()">Créer l'équipe</button>
    <button class="btn sec block" style="margin-top:8px" onclick="openTeamSwitcher()">Retour</button>
  `);
}
function createTeam(){
  const name=val("nt_name")||("Équipe "+(DB.teams.length+1));
  const t=newTeam(name,val("nt_cat"),val("nt_lvl"),[]);
  DB.teams.push(t); DB.activeTeam=t.id; save(); closeModal(); render(); flash("Équipe créée");
}

/* ============ MULTILINGUE ============ */
const LANG={
  fr:{home:"Accueil",roster:"Effectif",session:"Séance",match:"Match",tactics:"Tactique",hello:"Bonjour"},
  en:{home:"Home",roster:"Roster",session:"Practice",match:"Game",tactics:"Plays",hello:"Hello"},
  es:{home:"Inicio",roster:"Plantel",session:"Sesión",match:"Partido",tactics:"Jugadas",hello:"Hola"},
  pt:{home:"Início",roster:"Elenco",session:"Treino",match:"Jogo",tactics:"Jogadas",hello:"Olá"},
};
const ALL_LANGS=[
  {code:"fr",name:"Français",ready:true},{code:"en",name:"English",ready:true},
  {code:"es",name:"Español",ready:true},{code:"pt",name:"Português",ready:true},
  {code:"ca",name:"Català",ready:false},{code:"de",name:"Deutsch",ready:false},
  {code:"nl",name:"Nederlands",ready:false},{code:"it",name:"Italiano",ready:false},
  {code:"ar",name:"العربية",ready:false},{code:"ru",name:"Русский",ready:false},
  {code:"tr",name:"Türkçe",ready:false},{code:"el",name:"Ελληνικά",ready:false},
  {code:"pl",name:"Polski",ready:false},{code:"zh",name:"中文",ready:false},
  {code:"ja",name:"日本語",ready:false},{code:"ko",name:"한국어",ready:false},
  {code:"wo",name:"Wolof",ready:false},{code:"ln",name:"Lingala",ready:false},
];
function getLang(){ return (DB.profile && DB.profile.lang) || 'fr'; }
function tr(k){ const l=getLang(); const base=LANG[l]?l:'en'; return (LANG[base] && LANG[base][k]) || LANG.fr[k] || k; }
function setLang(code){
  DB.profile.lang=code; save(); closeModal();
  const l=ALL_LANGS.find(x=>x.code===code);

function animateNumbers(){
  document.querySelectorAll('#main .kpi .n, #main .scorebar .s').forEach(el=>{
    const raw=(el.textContent||'').trim(); if(!/^\d+$/.test(raw)) return; const target=parseInt(raw,10);
    if(target<=0){ el.textContent="0"; return; }
    const dur=Math.min(750,260+target*10); let t0=null; el.textContent="0";
    function step(ts){ if(!t0)t0=ts; const k=Math.min(1,(ts-t0)/dur); el.textContent=Math.round(target*(1-Math.pow(1-k,3))); if(k<1)requestAnimationFrame(step); else el.textContent=String(target); }
    requestAnimationFrame(step);
  });
}
function flash(msg){const f=document.getElementById("flash");f.textContent=msg;f.classList.add("on");clearTimeout(f._t);f._t=setTimeout(()=>f.classList.remove("on"),1400);}
/* Effets sonores discrets, synthétisés, sans fichier externe */
let _audio=null;
function sfx(type){
  try{
    if(DB.profile && DB.profile.muted) return;
    _audio=_audio||new (window.AudioContext||window.webkitAudioContext)();
    const t=_audio.currentTime, o=_audio.createOscillator(), g=_audio.createGain();
    o.connect(g); g.connect(_audio.destination);
    if(type==="ok"){ o.type="sine"; o.frequency.setValueAtTime(620,t); o.frequency.exponentialRampToValueAtTime(940,t+.12);
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.13,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.start(t); o.stop(t+.24); }
    else if(type==="swish"){ o.type="triangle"; o.frequency.setValueAtTime(320,t); o.frequency.exponentialRampToValueAtTime(120,t+.18);
      g.gain.setValueAtTime(.11,t); g.gain.exponentialRampToValueAtTime(.0001,t+.2); o.start(t); o.stop(t+.22); }
    else { o.type="sine"; o.frequency.setValueAtTime(520,t);
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.09,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.14); o.start(t); o.stop(t+.16); }
  }catch(e){}
}

function textPDF(title, sections){
  const { jsPDF }=window.jspdf; const pdf=new jsPDF({unit:"pt",format:"a4"});
  const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(); const M=40, W=pw-2*M; let y=56;
  pdf.setFont("helvetica","bold"); pdf.setFontSize(17); pdf.setTextColor(20,24,34);
  pdf.splitTextToSize(title,W).forEach(l=>{pdf.text(l,M,y);y+=22;}); y+=6;
  sections.forEach(s=>{
    if(s.h){ if(y>ph-90){pdf.addPage();y=56;} pdf.setFont("helvetica","bold");pdf.setFontSize(13);pdf.setTextColor(232,99,31); pdf.text(s.h,M,y); y+=17; }
    if(s.body){ pdf.setFont("helvetica","normal");pdf.setFontSize(11);pdf.setTextColor(45,45,45);
      pdf.splitTextToSize(s.body,W).forEach(l=>{ if(y>ph-50){pdf.addPage();y=56;} pdf.text(l,M,y); y+=15; }); y+=8;
    }
  });
  pdf.setFontSize(9);pdf.setTextColor(150,150,150);pdf.text("Fait avec PIVOT",M,ph-26);
  return pdf;
}
async function sharePDF(pdf,name,text){
  const blob=pdf.output("blob"); const file=new File([blob],name,{type:"application/pdf"});
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:text,text:text}); return; }catch(e){ if(e&&e.name==="AbortError")return; } }
  const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),5000);
  flash("PDF prêt");
}

async function realAI(q){
  const r=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:q, level:aiLevel,
      team:{name:T().name, category:T().category, level:T().level, opponent:T().match.opponent,
        players:(T().players||[]).length}})});
  if(!r.ok) throw new Error('api');
  const d=await r.json();
  if(!d||!d.reply) throw new Error('reply');
  return String(d.reply).replace(/</g,'&lt;').replace(/\n/g,'<br>');
}
async function askAI(q){

  try{ ans=await realAI(q); }

  drawChat();
}

  let h="";

  if(o.analyse) h+="<b>Analyse.</b> "+o.analyse+"<br><br>";
  if(o.propositions) h+="<b>Propositions.</b> "+o.propositions+"<br><br>";
  if(o.pas) h+="<b>Prochain pas.</b> "+o.pas;
  if(o.reserve) h+="<br><br><b>Réserve.</b> "+o.reserve;
  return h;
}

             reserve:"Sans connaître le niveau réel de tes tireurs, les dosages sont des points de départ, pas une vérité."})

let timerState=null;
function terrainView(){
  if(T().session.blocks.length===0){flash("Ajoute d'abord des blocs");return;}
  timerState={idx:0,remaining:T().session.blocks[0].dur*60,running:false,iv:null};
  drawTerrain();
}
function drawTerrain(){
  const b=T().session.blocks[timerState.idx];
  const mm=String(Math.floor(timerState.remaining/60)).padStart(2,"0");
  const ss=String(timerState.remaining%60).padStart(2,"0");
  openModal(`
    <h3>Vue terrain</h3>
    <div class="sub">Bloc ${timerState.idx+1}/${T().session.blocks.length}</div>
    <div class="card" style="text-align:center">

      <div style="font-size:19px;font-weight:800;margin-bottom:4px">${b.title}</div>
      <div class="muted" style="font-size:12px;margin-bottom:10px">Intensité ${b.intensity} · ${b.dur} min prévues</div>
      <div class="timerbig" id="tbig">${mm}:${ss}</div>
      <div class="hint">💬 Temps de parole conseillé : 2 min max avant de lancer</div>
    </div>
    <div class="grid2">
      <button class="btn" id="tbtn" onclick="toggleTimer()">${timerState.running?'⏸ Pause':'▶ Démarrer'}</button>
      <button class="btn sec" onclick="nextBlock()">Bloc suivant →</button>
    </div>
    <div style="height:8px"></div>
    <button class="btn ghost block" onclick="stopTimer();closeModal()">Fermer</button>
  `);
}
function toggleTimer(){
  timerState.running=!timerState.running;
  if(timerState.running){timerState.iv=setInterval(()=>{
    timerState.remaining--;
    if(timerState.remaining<=0){clearInterval(timerState.iv);timerState.running=false;flash("Bloc terminé");nextBlock();return;}
    const el=document.getElementById("tbig");
    if(el){el.textContent=String(Math.floor(timerState.remaining/60)).padStart(2,"0")+":"+String(timerState.remaining%60).padStart(2,"0");}
  },1000);}
  else clearInterval(timerState.iv);
  const btn=document.getElementById("tbtn");if(btn)btn.textContent=timerState.running?'⏸ Pause':'▶ Démarrer';
}
function stopTimer(){if(timerState&&timerState.iv)clearInterval(timerState.iv);}
function nextBlock(){stopTimer();if(timerState.idx<T().session.blocks.length-1){timerState.idx++;timerState.remaining=T().session.blocks[timerState.idx].dur*60;timerState.running=false;drawTerrain();}else{flash("Séance terminée 💪");closeModal();}}

/* ============ MATCH / STATS EN DIRECT ============ */
function matchIsPlayed(){return T().match.events.length>0;}
function boxScore(){
  const players={}, team={pts:0,fg2m:0,fg2a:0,fg3m:0,fg3a:0,ftm:0,fta:0,reb:0,ast:0,stl:0,tov:0,blk:0,foul:0};
  let opp=0;
  T().players.forEach(p=>players[p.id]={pts:0,fg2m:0,fg2a:0,fg3m:0,fg3a:0,ftm:0,fta:0,reb:0,ast:0,stl:0,tov:0,blk:0,foul:0});
  T().match.events.forEach(e=>{
    if(e.side==="opp"){opp+=e.pts||0;return;}
    const s=players[e.pid]; if(!s)return;
    switch(e.type){
      case"fg2":s.fg2a++;if(e.made){s.fg2m++;s.pts+=2;}break;
      case"fg3":s.fg3a++;if(e.made){s.fg3m++;s.pts+=3;}break;
      case"ft":s.fta++;if(e.made){s.ftm++;s.pts+=1;}break;
      case"reb":s.reb++;break; case"ast":s.ast++;break; case"stl":s.stl++;break;
      case"tov":s.tov++;break; case"blk":s.blk++;break; case"foul":s.foul++;break;
    }
  });
  Object.values(players).forEach(s=>{team.pts+=s.pts;team.reb+=s.reb;team.ast+=s.ast;team.fg2m+=s.fg2m;team.fg3m+=s.fg3m;team.ftm+=s.ftm;});
  return {players,team,opp};
}

function drawCourt(){
  const wrap=document.getElementById("courtWrap");
  wrap.innerHTML=courtSVG();
  const svg=document.getElementById("courtSVG");
  drawTokens();drawPaths();
  svg.addEventListener("pointerdown",onDown);
  svg.addEventListener("pointermove",onMove);
  svg.addEventListener("pointerup",onUp);
  svg.addEventListener("pointerleave",onUp);

function svgPt(evt){
  const svg=document.getElementById("courtSVG");
  const r=svg.getBoundingClientRect();
  const x=(evt.clientX-r.left)/r.width*CW;
  const y=(evt.clientY-r.top)/r.height*CH;
  return {x:Math.max(6,Math.min(CW-6,x)),y:Math.max(6,Math.min(CH-6,y))};
}
function tokenAt(pt){
  const f=curFrame();let best=null,bd=1e9;
  f.tokens.forEach(t=>{const d=Math.hypot(t.x-pt.x,t.y-pt.y);if(d<24&&d<bd){bd=d;best=t;}});
  return best;
}
function onDown(e){
  if(tac.playing)return;
  const pt=svgPt(e);const t=tac.tool;
  if(t==="select"){const tk=tokenAt(pt);if(tk)tac.drag=tk;return;}
  if(t==="add-off"||t==="add-def"||t==="add-ball"){
    const f=curFrame();
    if(t==="add-ball"){f.tokens=f.tokens.filter(x=>x.kind!=="ball");f.tokens.push({id:"ball",kind:"ball",label:"",x:pt.x,y:pt.y});}
    else{const kind=t==="add-off"?"off":"def";const n=f.tokens.filter(x=>x.kind===kind).length+1;
      f.tokens.push({id:kind[0]+uid().slice(0,4),kind,label:String(n),x:pt.x,y:pt.y});}
    drawTokens();return;
  }
  if(t==="erase"){const tk=tokenAt(pt);const f=curFrame();
    if(tk){f.tokens=f.tokens.filter(x=>x!==tk);drawTokens();}
    else{ // erase nearest path
      if(f.paths.length){f.paths.pop();drawPaths();}
    }return;
  }
  if(t==="pen"){
    tac.drawing={type:"pen",color:tac.penColor,points:[pt]};
    return;
  }
  if(["move","dribble","pass","screen"].includes(t)){
    const tk=tokenAt(pt);
    tac.drawing={type:t,from:tk?tk.id:null,points:[tk?{x:tk.x,y:tk.y}:pt]};
  }
}
function onMove(e){
  if(tac.playing)return;
  const pt=svgPt(e);
  if(tac.drag){tac.drag.x=pt.x;tac.drag.y=pt.y;
    if(tac.drag.kind!=="ball"){/* rien */}
    drawTokens();
    return;}
  if(tac.drawing){const last=tac.drawing.points[tac.drawing.points.length-1];
    const th=tac.drawing.type==="pen"?3:8;
    if(Math.hypot(pt.x-last.x,pt.y-last.y)>th){tac.drawing.points.push(pt);drawPaths(true);}
  }
}
function onUp(e){
  if(tac.drag){tac.drag=null;save?save():0;return;}
  if(tac.drawing){
    if(tac.drawing.points.length>1){curFrame().paths.push(tac.drawing);}
    tac.drawing=null;drawPaths();
  }
}
function tokensMarkup(f){
  return f.tokens.map(t=>{
    if(t.kind==="ball") return `<g><circle cx="${t.x}" cy="${t.y}" r="9" fill="#e6a700" stroke="#8a5a00" stroke-width="1.5"/><path d="M${t.x-9},${t.y} h18 M${t.x},${t.y-9} v18" stroke="#8a5a00" stroke-width="1"/></g>`;
    const col=t.kind==="off"?"#e8631f":"#2f6bd6";
    return `<g><circle cx="${t.x}" cy="${t.y}" r="15" fill="${col}" stroke="#0b0e12" stroke-width="2"/><text x="${t.x}" y="${t.y+5}" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">${t.label}</text></g>`;
  }).join("");
}
function drawTokens(){
  const layer=document.getElementById("tokensLayer");if(!layer)return;
  layer.innerHTML=tokensMarkup(curFrame());
}
function pathD(pts){return "M"+pts.map(p=>`${p.x},${p.y}`).join(" L");}
function renderPath(p,temp){
  const rc=(!temp && tacReveal)?'class="pdraw" pathLength="1"':'';
  if(p.type==="pen"){
    return `<path ${rc} d="${pathD(p.points)}" fill="none" stroke="${p.color||'#ffffff'}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="${temp?.75:1}"/>`;
  }
  const col = p.type==="pass"?"#ffffff":p.type==="screen"?"#ffd23f":p.type==="dribble"?"#8ef2c0":"#ffffff";
  const dash = p.type==="pass"?'stroke-dasharray="2 7"':p.type==="dribble"?'stroke-dasharray="1 5"':"";
  const marker = 'marker-end="url(#arrow)"';
  let extra="";
  if(p.type==="screen"){const a=p.points[p.points.length-1],b=p.points[p.points.length-2]||a;
    const ang=Math.atan2(a.y-b.y,a.x-b.x)+Math.PI/2;const l=11;
    extra=`<line x1="${a.x-Math.cos(ang)*l}" y1="${a.y-Math.sin(ang)*l}" x2="${a.x+Math.cos(ang)*l}" y2="${a.y+Math.sin(ang)*l}" stroke="${col}" stroke-width="3"/>`;
  }
  return `<path d="${pathD(p.points)}" fill="none" stroke="${col}" stroke-width="3" ${dash} ${p.type==="screen"?"":marker} opacity="${temp?.6:.95}"/>${extra}`;
}
function drawPaths(withTemp){
  const layer=document.getElementById("pathsLayer");if(!layer)return;
  let html=curFrame().paths.map(p=>renderPath(p,false)).join("");
  if(withTemp&&tac.drawing)html+=renderPath(tac.drawing,true);
  layer.innerHTML=html;
  tacReveal=false;
}
function drawFramesStrip(){
  const s=document.getElementById("framesStrip");if(!s)return;
  s.innerHTML=tac.frames.map((f,i)=>`<div class="frame-thumb ${i===tac.cur?'active':''}" onclick="gotoFrame(${i})"><small>${i+1}</small>🏀</div>`).join("")
    + `<div class="frame-thumb" onclick="addFrame()">＋</div>`;
}
function gotoFrame(i){if(tac.playing)return;tac.cur=i;tacReveal=true;drawTokens();drawPaths();drawFramesStrip();}
function addFrame(){
  const copy=JSON.parse(JSON.stringify(curFrame()));copy.paths=[]; // nouvelle image: garde positions, efface tracés
  tac.frames.splice(tac.cur+1,0,copy);tac.cur++;drawTokens();drawPaths();drawFramesStrip();flash("Image ajoutée");
}
function clearFrame(){curFrame().tokens=[];curFrame().paths=[];drawTokens();drawPaths();}
function playAnim(){
  if(tac.frames.length<2){flash("Ajoute une 2e image pour animer");return;}
  if(tac.playing)return;tac.playing=true;
  const layerP=document.getElementById("pathsLayer");if(layerP)layerP.innerHTML="";
  let seg=0;
  const step=()=>{
    if(seg>=tac.frames.length-1){tac.playing=false;tac.cur=tac.frames.length-1;drawTokens();drawPaths();return;}
    const A=tac.frames[seg],B=tac.frames[seg+1];const dur=900;let t0=null;
    const frame=(ts)=>{
      if(!t0)t0=ts;const k=Math.min(1,(ts-t0)/dur);
      const layer=document.getElementById("tokensLayer");
      layer.innerHTML=A.tokens.map(a=>{
        const b=B.tokens.find(x=>x.id===a.id)||a;
        const x=a.x+(b.x-a.x)*k, y=a.y+(b.y-a.y)*k;
        if(a.kind==="ball")return `<g><circle cx="${x}" cy="${y}" r="9" fill="var(--ball)" stroke="#b8860b" stroke-width="1.5"/></g>`;
        const col=a.kind==="off"?"var(--off)":"var(--def)";
        return `<g><circle cx="${x}" cy="${y}" r="15" fill="${col}" stroke="#0b0e12" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="15" font-weight="800" fill="#0b0e12">${a.label}</text></g>`;
      }).join("");
      if(k<1)requestAnimationFrame(frame);else{seg++;setTimeout(step,120);}
    };
    requestAnimationFrame(frame);
  };
  step();
}

function frameStandaloneSVG(f){
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${CW} ${CH}" width="${CW}" height="${CH}">
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/></marker></defs>
    <rect x="0" y="0" width="${CW}" height="${CH}" fill="#14572b"/>
    ${courtMarkings()}
    ${f.paths.map(p=>renderPath(p,false)).join("")}
    ${tokensMarkup(f)}
  </svg>`;
}
function svgToImage(svgStr){
  return new Promise((res,rej)=>{
    const blob=new Blob([svgStr],{type:"image/svg+xml;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);res(img);};
    img.onerror=(e)=>{URL.revokeObjectURL(url);rej(e);};
    img.src=url;
  });
}
async function buildPDFBlob(title){
  const { jsPDF }=window.jspdf;
  const pdf=new jsPDF({orientation:"portrait",unit:"pt",format:"a4"});
  const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
  for(let i=0;i<tac.frames.length;i++){
    if(i>0) pdf.addPage();
    pdf.setFontSize(16); pdf.setTextColor(20,24,34);
    pdf.text(title+"   image "+(i+1)+" sur "+tac.frames.length, 40, 46);
    const img=await svgToImage(frameStandaloneSVG(tac.frames[i]));
    const c=document.createElement("canvas"); c.width=CW*2; c.height=CH*2;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const iw=pw-80;
    pdf.addImage(c.toDataURL("image/png"),"PNG",40,64,iw,iw*(CH/CW));
    pdf.setFontSize(9); pdf.setTextColor(150,150,150);
    pdf.text("Fait avec PIVOT", 40, ph-28);
  }
  return pdf;
}
async function exportPDF(){
  if(!window.jspdf){ flash("Export PDF en cours de chargement, réessaie"); return; }
  flash("Génération du PDF...");
  try{ const pdf=await buildPDFBlob("Système PIVOT"); pdf.save("systeme_pivot.pdf"); flash("PDF exporté"); }
  catch(e){ flash("Souci pendant l'export PDF"); }
}
function circleC(ctx,x,y,r,stroke,lw){ ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2); ctx.strokeStyle=stroke||"#eaeaea"; ctx.lineWidth=lw||2.5; ctx.stroke(); }
function drawCourtCanvas(ctx){
  ctx.globalAlpha=1; ctx.fillStyle="#14572b"; ctx.fillRect(0,0,CW,CH);
  ctx.globalAlpha=0.85; ctx.strokeStyle="#eaeaea"; ctx.lineWidth=2.5;
  if(tac.court==="blank"){ ctx.globalAlpha=0.4; ctx.strokeRect(10,8,480,454); ctx.globalAlpha=1; return; }
  ctx.strokeRect(10,8,480,454);
  if(tac.court==="full"){
    ctx.beginPath();ctx.moveTo(10,235);ctx.lineTo(490,235);ctx.stroke();
    circleC(ctx,250,235,42);
    ctx.strokeRect(180,8,140,130); circleC(ctx,250,138,42); circleC(ctx,250,46,10,"#ff8a4c",4);
    ctx.strokeRect(180,332,140,130); circleC(ctx,250,332,42); circleC(ctx,250,424,10,"#ff8a4c",4);
  } else {
    ctx.strokeRect(180,8,140,190); circleC(ctx,250,198,60);
    ctx.beginPath();ctx.moveTo(180,198);ctx.lineTo(320,198);ctx.stroke();
    circleC(ctx,250,60,12,"#ff8a4c",4);
  }
  ctx.globalAlpha=1;
}
function drawPathsCanvas(ctx,paths){
  paths.forEach(p=>{
    if(!p.points||p.points.length<2)return;
    ctx.beginPath(); p.points.forEach((pt,i)=>i?ctx.lineTo(pt.x,pt.y):ctx.moveTo(pt.x,pt.y));
    ctx.lineWidth=3.5; ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.strokeStyle = p.type==="pen"?(p.color||"#ffffff"):p.type==="screen"?"#ffd23f":p.type==="dribble"?"#8ef2c0":"#ffffff";
    if(p.type==="pass") ctx.setLineDash([2,7]); else if(p.type==="dribble") ctx.setLineDash([1,5]); else ctx.setLineDash([]);
    ctx.stroke(); ctx.setLineDash([]);
  });
}
function drawTokensCanvas(ctx,tokens){
  tokens.forEach(t=>{
    if(t.kind==="ball"){ ctx.beginPath();ctx.arc(t.x,t.y,9,0,Math.PI*2);ctx.fillStyle="#e6a700";ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle="#8a5a00";ctx.stroke(); return; }
    ctx.beginPath();ctx.arc(t.x,t.y,15,0,Math.PI*2);ctx.fillStyle=t.kind==="off"?"#e8631f":"#2f6bd6";ctx.fill();ctx.lineWidth=2;ctx.strokeStyle="#0b0e12";ctx.stroke();
    ctx.fillStyle="#ffffff";ctx.font="bold 15px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(t.label,t.x,t.y);
  });

function exportVideo(){
  if(tac.frames.length<2){ flash("Ajoute une 2e image pour la vidéo"); return; }
  const canvas=document.createElement("canvas"); canvas.width=CW; canvas.height=CH;
  const ctx=canvas.getContext("2d");
  let stream, rec; const chunks=[];
  try{ stream=canvas.captureStream(30); rec=new MediaRecorder(stream,{mimeType:"video/webm"}); }
  catch(e){ flash("Vidéo non supportée sur ce navigateur"); return; }
  rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  rec.onstop=()=>{
    const blob=new Blob(chunks,{type:"video/webm"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="systeme_pivot.webm"; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    flash("Vidéo exportée");
  };
  flash("Enregistrement de la vidéo...");
  rec.start();
  const holdMs=500, moveMs=1000;
  let seg=0, phase="hold", t0=performance.now();
  function tick(now){
    const A=tac.frames[seg], B=tac.frames[Math.min(seg+1,tac.frames.length-1)];
    drawCourtCanvas(ctx);
    if(phase==="hold"){
      drawPathsCanvas(ctx,A.paths); drawTokensCanvas(ctx,A.tokens);
      if(now-t0>=holdMs){ phase="move"; t0=now; }
    } else {
      const k=Math.min(1,(now-t0)/moveMs);
      drawTokensCanvas(ctx, A.tokens.map(a=>{ const b=B.tokens.find(x=>x.id===a.id)||a; return {kind:a.kind,label:a.label,x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k}; }));
      if(k>=1){
        seg++;
        if(seg>=tac.frames.length-1){
          drawCourtCanvas(ctx); drawPathsCanvas(ctx,B.paths); drawTokensCanvas(ctx,B.tokens);
          setTimeout(()=>{ try{rec.stop();}catch(e){} }, 700);
          return;
        }
        phase="hold"; t0=now;
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

const VLABEL={fg2:"Tir 2",fg3:"Tir 3",ft:"Lancer",reb:"Rebond",ast:"Passe D.",stl:"Interception",tov:"Perte",blk:"Contre",foul:"Faute"};
function parseVoice(raw){
  let t=(raw||"").toLowerCase();
  let type=null, made;
  if(/(3|trois)\s*(points?|pts?)|(à|a)\s*(3|trois)\b/.test(t)){type="fg3";t=t.replace(/(3|trois)\s*(points?|pts?)/g," ");}
  else if(/(2|deux)\s*(points?|pts?)|panier/.test(t)){type="fg2";t=t.replace(/(2|deux)\s*(points?|pts?)/g," ");}
  else if(/lancer/.test(t)){type="ft";}
  else if(/rebond/.test(t)){type="reb";}
  else if(/passe|caviar|d[ée]cisive/.test(t)){type="ast";}
  else if(/interception|\binter\b/.test(t)){type="stl";}
  else if(/perte|perdue|perdu/.test(t)){type="tov";}
  else if(/contre/.test(t)){type="blk";}
  else if(/faute/.test(t)){type="foul";}
  if(["fg2","fg3","ft"].includes(type)){ made = !/rat[ée]|manqu[ée]|loup[ée]|dehors|hors|pas dedans/.test(t); }
  const words={zero:0,un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10,onze:11,douze:12,treize:13,quatorze:14,quinze:15};
  let num=null;
  const m=t.match(/num[ée]ro\s*(\d+)/)||t.match(/\b(\d{1,2})\b/);
  if(m) num=parseInt(m[1]);
  if(num===null){ for(const w in words){ if(new RegExp("\\b"+w+"\\b").test(t)){num=words[w];break;} } }
  if(type===null||num===null) return null;
  const p=T().players.find(x=>x.num===num);
  if(!p) return {error:"Numéro "+num+" introuvable dans l'effectif"};
  return {pid:p.id, num, type, made};
}
function applyVoicePhrase(text){
  text=(text||"").trim(); if(!text) return;
  const r=parseVoice(text);
  if(!r){ voiceLog.unshift('❓ "'+text+'" · non compris'); renderMatch(); flash("Non compris, réessaie"); return; }
  if(r.error){ voiceLog.unshift('⚠️ "'+text+'" · '+r.error); renderMatch(); flash(r.error); return; }
  T().match.events.push({id:uid(),pid:r.pid,type:r.type,made:r.made,side:"us"});
  const res = (["fg2","fg3","ft"].includes(r.type)) ? (r.made?" réussi":" manqué") : "";
  voiceLog.unshift('✅ #'+r.num+' '+plName(r.pid)+' · '+VLABEL[r.type]+res);
  save(); renderMatch(); flash("Ajouté par la voix");
}
function toggleVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ flash("Micro non dispo sur ce navigateur, tape la phrase"); return; }
  if(voiceOn){ if(voiceRec) voiceRec.stop(); voiceOn=false; return; }
  voiceRec=new SR(); voiceRec.lang="fr-FR"; voiceRec.continuous=true; voiceRec.interimResults=false;
  voiceRec.onresult=(e)=>{ const tr=e.results[e.results.length-1][0].transcript; applyVoicePhrase(tr); };
  voiceRec.onend=()=>{ voiceOn=false; const b=document.getElementById("micBtn"); if(b)b.textContent="🎤 Dicter"; };
  voiceRec.onerror=()=>{ voiceOn=false; flash("Micro interrompu"); };
  try{ voiceRec.start(); voiceOn=true; const b=document.getElementById("micBtn"); if(b)b.textContent="⏹ Écoute..."; flash("Parle : numéro, action, réussi ou manqué"); }
  catch(err){ flash("Impossible de démarrer le micro"); }
}

  const opts=[

}

function addExoToSession(id){
  const e=EXO.find(x=>x.id===id);

}

/* ============ INCLINAISON 3D DES CARTES (style Apple) ============ */
(function(){
  if(!window.matchMedia || !matchMedia('(hover:hover)').matches) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let raf=null, cur=null;
  document.addEventListener('pointermove',function(e){
    const card=(e.target && e.target.closest)?e.target.closest('.card'):null;
    if(cur && cur!==card){ cur.classList.remove('tilted'); cur.style.transform=''; cur=null; }
    if(!card) return;
    cur=card; card.classList.add('tilted');
    const r=card.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width-0.5, py=(e.clientY-r.top)/r.height-0.5;
    if(raf)cancelAnimationFrame(raf);
    raf=requestAnimationFrame(function(){ card.style.transform='perspective(820px) rotateY('+(px*7).toFixed(2)+'deg) rotateX('+(-py*7).toFixed(2)+'deg) translateZ(8px)'; });
  },{passive:true});
  document.addEventListener('pointerdown',function(){ if(cur){cur.classList.remove('tilted');cur.style.transform='';cur=null;} },{passive:true});
})();
